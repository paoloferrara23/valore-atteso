name: Test newsletter A2

# Invio di prova del template A2 a info@valoreatteso.com (indirizzo fisso nello script).
# Non tocca la lista iscritti né gli invii del martedì.
on:
  workflow_dispatch:
    inputs:
      num:
        description: 'Numero edizione con file in docs/newsletter-a2 (es. 026)'
        required: true
        default: '026'

jobs:
  send:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Invio di prova
        env:
          BREVO_KEY: ${{ secrets.BREVO_KEY }}
          NUM: ${{ github.event.inputs.num }}
        run: node scripts/newsletter-a2-send-test.js "$NUM"
