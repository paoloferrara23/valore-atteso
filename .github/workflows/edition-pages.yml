name: Edition Pages (SEO)

# Genera una pagina statica indicizzabile per ogni edizione pubblicata
# (anteprima + gate iscrizione) e aggiorna sitemap.xml, poi committa su main.
# Le edizioni escono il martedì: gira ogni mattina (idempotente) + on demand.

on:
  schedule:
    - cron: '0 6 * * *'  # ogni giorno 08:00 IT (6 UTC)
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-pages:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Genera pagine edizioni + sitemap
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
        run: node scripts/generate-edition-pages.js
      - name: Commit se ci sono cambiamenti
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add edizione-*.html sitemap.xml
          if git diff --staged --quiet; then
            echo "Nessun cambiamento: sitemap e pagine gia aggiornate."
          else
            git commit -m "chore: rigenera pagine edizioni + sitemap [skip ci]"
            git push
          fi
